default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgres://notean:notean@localhost:5432/notean_development") %>
  gssencmode: disable

test:
  <<: *default
  url: postgres://notean:notean@localhost:5432/notean_test
  gssencmode: disable

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
