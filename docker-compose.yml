services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: notean
      POSTGRES_PASSWORD: notean
      POSTGRES_DB: notean_development
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notean"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
