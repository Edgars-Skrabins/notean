<nav class="dashboardSidebar" [class.dashboardSidebar--collapsed]="collapsed">
  <a class="dashboardSidebar__item" routerLink="home" routerLinkActive="dashboardSidebar__item--active" [title]="PHRASES.HOME | translate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12l9-9 9 9"></path>
      <path d="M5 10v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V10"></path>
    </svg>
    <span class="dashboardSidebar__label">{{ PHRASES.HOME | translate }}</span>
  </a>

  <a class="dashboardSidebar__item" routerLink="projects" routerLinkActive="dashboardSidebar__item--active" [title]="PHRASES.PROJECTS | translate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"></path>
    </svg>
    <span class="dashboardSidebar__label">{{ PHRASES.PROJECTS | translate }}</span>
  </a>

  <a class="dashboardSidebar__item" routerLink="pages" routerLinkActive="dashboardSidebar__item--active" [title]="PHRASES.DOCUMENT_PAGES | translate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
    </svg>
    <span class="dashboardSidebar__label">{{ PHRASES.DOCUMENT_PAGES | translate }}</span>
  </a>

  <a class="dashboardSidebar__item" routerLink="diagrams" routerLinkActive="dashboardSidebar__item--active" [title]="PHRASES.DIAGRAMS | translate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="3"></circle>
      <circle cx="6" cy="12" r="3"></circle>
      <circle cx="18" cy="19" r="3"></circle>
      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
      <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
    </svg>
    <span class="dashboardSidebar__label">{{ PHRASES.DIAGRAMS | translate }}</span>
  </a>

  <a class="dashboardSidebar__item" routerLink="kanban" routerLinkActive="dashboardSidebar__item--active" [title]="PHRASES.KANBAN_BOARDS | translate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <rect x="7" y="7" width="3" height="9"></rect>
      <rect x="14" y="7" width="3" height="5"></rect>
    </svg>
    <span class="dashboardSidebar__label">{{ PHRASES.KANBAN_BOARDS | translate }}</span>
  </a>

  <button
    type="button"
    class="dashboardSidebar__toggle"
    (click)="toggleCollapsed()"
    [title]="(collapsed ? PHRASES.EXPAND_SIDEBAR : PHRASES.COLLAPSE_SIDEBAR) | translate"
    [attr.aria-label]="(collapsed ? PHRASES.EXPAND_SIDEBAR : PHRASES.COLLAPSE_SIDEBAR) | translate"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
    <span class="dashboardSidebar__label">{{ PHRASES.COLLAPSE_SIDEBAR | translate }}</span>
  </button>
</nav>
