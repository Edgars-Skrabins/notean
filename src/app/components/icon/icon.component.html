<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [ngSwitch]="name">
  <ng-container *ngSwitchCase="'plus'">
    <line x1="12" y1="5" x2="12" y2="19"></line>
    <line x1="5" y1="12" x2="19" y2="12"></line>
  </ng-container>

  <ng-container *ngSwitchCase="'folder'">
    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"></path>
  </ng-container>

  <ng-container *ngSwitchCase="'folder-plus'">
    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"></path>
    <line x1="12" y1="11" x2="12" y2="17"></line>
    <line x1="9" y1="14" x2="15" y2="14"></line>
  </ng-container>

  <ng-container *ngSwitchCase="'chevron-right'">
    <polyline points="9 18 15 12 9 6"></polyline>
  </ng-container>

  <ng-container *ngSwitchCase="'trash'">
    <polyline points="3 6 5 6 21 6"></polyline>
    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
    <path d="M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
  </ng-container>

  <ng-container *ngSwitchCase="'edit'">
    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
  </ng-container>

  <ng-container *ngSwitchCase="'save'">
    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
    <polyline points="17 21 17 13 7 13 7 21"></polyline>
    <polyline points="7 3 7 8 15 8"></polyline>
  </ng-container>

  <ng-container *ngSwitchCase="'x'">
    <line x1="18" y1="6" x2="6" y2="18"></line>
    <line x1="6" y1="6" x2="18" y2="18"></line>
  </ng-container>

  <ng-container *ngSwitchCase="'menu'">
    <line x1="3" y1="6" x2="21" y2="6"></line>
    <line x1="3" y1="12" x2="21" y2="12"></line>
    <line x1="3" y1="18" x2="21" y2="18"></line>
  </ng-container>

  <ng-container *ngSwitchCase="'zoom-fit'">
    <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"></path>
  </ng-container>

  <ng-container *ngSwitchCase="'flow-terminator'">
    <ellipse cx="12" cy="12" rx="9" ry="6"></ellipse>
  </ng-container>

  <ng-container *ngSwitchCase="'flow-process'">
    <rect x="4" y="6" width="16" height="12" rx="3"></rect>
  </ng-container>

  <ng-container *ngSwitchCase="'flow-decision'">
    <polygon points="12,3 21,12 12,21 3,12"></polygon>
  </ng-container>

  <ng-container *ngSwitchCase="'flow-io'">
    <polygon points="7,6 21,6 17,18 3,18"></polygon>
  </ng-container>
</svg>
