<header class="dashboardHeader">
  <div class="dashboardHeader__brand">Notean</div>

  <div class="dashboardHeader__actions">
    <app-language-switcher></app-language-switcher>

    <div class="dashboardHeader__menu">
      <button type="button" class="dashboardHeader__trigger" (click)="toggleMenu()">
        <span class="dashboardHeader__username">{{ username }}</span>
        <span class="dashboardHeader__iconButton" [attr.aria-label]="PHRASES.MENU | translate">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </span>
      </button>

      <div class="dashboardHeader__dropdown" *ngIf="isMenuOpen">
        <button type="button" class="dashboardHeader__dropdownItem" (click)="handleGoToProfile()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          {{ PHRASES.PROFILE | translate }}
        </button>
        <button type="button" class="dashboardHeader__dropdownItem" (click)="handleGoToSettings()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 5v-2M12 21v-2M5 12h-2M21 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"></path>
          </svg>
          {{ PHRASES.SETTINGS | translate }}
        </button>
        <button type="button" class="dashboardHeader__dropdownItem" (click)="handleGoToTeams()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          {{ PHRASES.TEAMS | translate }}
        </button>
        <button type="button" class="dashboardHeader__dropdownItem" *ngIf="showManageTeam" (click)="handleGoToManageTeam()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="17" y1="16" x2="23" y2="16"></line>
          </svg>
          {{ PHRASES.MANAGE_TEAM | translate }}
        </button>
        <button type="button" class="dashboardHeader__dropdownItem dashboardHeader__dropdownItem--danger" (click)="handleLogout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          {{ PHRASES.LOGOUT | translate }}
        </button>
      </div>
    </div>
  </div>
</header>
