<main class="container">
  <div *ngFor="let drawer of drawers" class="drawerContainer">
    <button (click)="handleDrawerClick(drawer)">{{ drawer.name | translate }}</button>
  </div>
  <div class="contentContainer">
    <ng-container *ngIf="drawers[currentOpenDrawerID] as selectedDrawer">
      <ng-container *ngComponentOutlet="selectedDrawer.component"></ng-container>
    </ng-container>
  </div>
</main>
