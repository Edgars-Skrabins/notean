<main>
  <div class="formContainer">
    <h2 class="h2 center"> Login!</h2>

    <label class="inputLabel" for="emailInput">
      Email
      <input
        [(ngModel)]="email"
        class=""
        id="emailInput"
        placeholder="Enter email"
        type="email"
      />
    </label>

    <label class="inputLabel" for="passwordInput">
      Password
      <input
        [(ngModel)]="password"
        class=""
        id="passwordInput"
        maxlength="24"
        placeholder="password"
        type="password"
      />
    </label>

    <button (click)="handleLogin()">Login</button>
    <p> {{ alertMessage }} </p>
    <p> Don't have an account? </p>
    <button (click)="handleGoToRegister()">Register</button>
  </div>
</main>
