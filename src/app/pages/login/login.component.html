<main>
  <div class="formContainer">
    <h2 class="h2 center"> {{ PHRASES.WELCOME_BACK | translate }}</h2>

    <label class="inputLabel" for="emailInput">
      {{ PHRASES.EMAIL | translate }}
      <input
        [(ngModel)]="email"
        [placeholder]="PHRASES.ENTER_EMAIL | translate"
        id="emailInput"
        type="email"
      />
    </label>

    <label class="inputLabel" for="passwordInput">
      {{ PHRASES.PASSWORD | translate }}
      <input
        [(ngModel)]="password"
        [placeholder]="PHRASES.ENTER_PASSWORD | translate"
        id="passwordInput"
        type="password"
      />
    </label>

    <button (click)="handleLogin()">{{ PHRASES.LOGIN | translate }}</button>
    <p> {{ alertMessage }} </p>
    <p> {{ PHRASES.NO_ACCOUNT_YET | translate }} </p>
    <button (click)="handleGoToRegister()">{{ PHRASES.REGISTER | translate }}</button>
  </div>
</main>
