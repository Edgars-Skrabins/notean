<main>
  <div class="formContainer">
    <h2 class="h2 center"> Create your account!</h2>

    <label class="inputLabel" for="emailInput">
      Email
      <input
        [(ngModel)]="email"
        id="emailInput"
        placeholder="Enter email"
        type="email"
      />
    </label>

    <label class="inputLabel" for="passwordInput">
      Password
      <input
        [(ngModel)]="password"
        id="passwordInput"
        placeholder="password"
        type="password"
      />
    </label>

    <button (click)="handleRegister()">Register</button>
    <p> {{ alertMessage }} </p>
    <p> Already have an account? </p>
    <button (click)="handleGoToLogin()">Login</button>
  </div>
</main>
