<app-auth-card
  [title]="PHRASES.CREATE_ACCOUNT | translate"
  [subtitle]="PHRASES.REGISTER_SUBTITLE | translate"
>
  <button card-corner class="authCornerLink" (click)="handleGoToLogin()">
    {{ PHRASES.LOGIN | translate }}
    <span class="authCornerLink__arrow" aria-hidden="true">&rarr;</span>
  </button>

  <div class="authField">
    <label class="authField__label" for="emailInput">{{ PHRASES.EMAIL | translate }}</label>
    <input
      [(ngModel)]="email"
      [placeholder]="PHRASES.ENTER_EMAIL | translate"
      id="emailInput"
      type="email"
    />
  </div>

  <div class="authField">
    <label class="authField__label" for="usernameInput">{{ PHRASES.USERNAME | translate }}</label>
    <input
      [(ngModel)]="username"
      [placeholder]="PHRASES.ENTER_USERNAME | translate"
      id="usernameInput"
      type="text"
    />
  </div>

  <div class="authField">
    <label class="authField__label" for="passwordInput">{{ PHRASES.PASSWORD | translate }}</label>
    <input
      [(ngModel)]="password"
      [placeholder]="PHRASES.ENTER_PASSWORD | translate"
      id="passwordInput"
      type="password"
    />
  </div>

  <button class="authButton" (click)="handleRegister()">{{ PHRASES.REGISTER | translate }}</button>
  <p class="authStatus" *ngIf="alertMessage">{{ alertMessage }}</p>
</app-auth-card>
