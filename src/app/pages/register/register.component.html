<main>
  <div class="formContainer">
    <h2 class="h2 center"> {{ 'CREATE_ACCOUNT' | translate }}</h2>

    <label class="inputLabel" for="emailInput">
      {{ 'EMAIL' | translate }}
      <input
        [(ngModel)]="email"
        [placeholder]="'ENTER_EMAIL' | translate"
        id="emailInput"
        type="email"
      />
    </label>

    <label class="inputLabel" for="passwordInput">
      {{ 'PASSWORD' | translate }}
      <input
        [(ngModel)]="password"
        [placeholder]="'ENTER_PASSWORD' | translate"
        id="passwordInput"
        type="password"
      />
    </label>

    <button (click)="handleRegister()">{{ 'REGISTER' | translate }}</button>
    <p> {{ alertMessage }} </p>
    <p> {{ 'ALREADY_HAVE_ACCOUNT' | translate }} </p>
    <button (click)="handleGoToLogin()">{{ 'LOGIN' | translate }}</button>
  </div>
</main>
