<app-auth-card
  [title]="(createdTeamCode ? PHRASES.TEAM_CREATED : PHRASES.CREATE_TEAM) | translate"
  [subtitle]="createdTeamCode ? (PHRASES.TEAM_CODE_SHARE_NOTICE | translate) : (PHRASES.CREATE_TEAM_SUBTITLE | translate)"
>
  <button card-corner class="authCornerLink" *ngIf="!createdTeamCode" (click)="handleGoToJoinTeam()">
    {{ PHRASES.JOIN_TEAM | translate }}
    <span class="authCornerLink__arrow" aria-hidden="true">&rarr;</span>
  </button>

  <ng-container *ngIf="!createdTeamCode; else createdView">
    <div class="authField">
      <label class="authField__label" for="teamNameInput">{{ PHRASES.TEAM_NAME | translate }}</label>
      <input
        [(ngModel)]="teamName"
        id="teamNameInput"
        type="text"
      />
    </div>

    <div class="authField">
      <label class="authField__label" for="teamPasswordInput">{{ PHRASES.PASSWORD | translate }}</label>
      <input
        [(ngModel)]="teamPassword"
        id="teamPasswordInput"
        maxlength="24"
        type="password"
      />
    </div>

    <button class="authButton" (click)="handleCreateTeam()">{{ PHRASES.CREATE_TEAM | translate }}</button>
    <p class="authStatus" *ngIf="alertMessage">{{ alertMessage }}</p>
  </ng-container>

  <ng-template #createdView>
    <div class="authCodeDisplay">
      <span class="authCodeDisplay__text">{{ createdTeamCode }}</span>
      <button
        type="button"
        class="authCodeDisplay__copyButton"
        [class.authCodeDisplay__copyButton--copied]="codeCopied"
        [attr.aria-label]="(codeCopied ? PHRASES.CODE_COPIED : PHRASES.COPY_CODE) | translate"
        [title]="(codeCopied ? PHRASES.CODE_COPIED : PHRASES.COPY_CODE) | translate"
        (click)="handleCopyCode()"
      >
        <svg *ngIf="!codeCopied" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <svg *ngIf="codeCopied" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
    </div>
    <button class="authButton" (click)="handleContinueToDashboard()">{{ PHRASES.CONTINUE | translate }}</button>
  </ng-template>
</app-auth-card>
