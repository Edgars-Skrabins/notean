<app-item-detail-layout
  *ngIf="item || mode === 'create'"
  [item]="item"
  favoriteType="Diagram"
  [titlePlaceholder]="PHRASES.DIAGRAM_TITLE_PLACEHOLDER"
  [editingBannerText]="PHRASES.DIAGRAM_BEING_EDITED_BY"
  [confirmDeleteMessage]="PHRASES.CONFIRM_DELETE_DIAGRAM"
  [fill]="true"
  [discardConfirmMessage]="PHRASES.CONFIRM_DISCARD_NEW_DIAGRAM"
  [mode]="mode"
  [(draftTitle)]="draftTitle"
  [editingNickname]="otherEditorNickname"
  [alertMessage]="alertMessage"
  [showDeleteConfirm]="showDeleteConfirm"
  [showDiscardConfirm]="showDiscardConfirm"
  [showEditConflict]="editConflict !== null"
  [draftProjectId]="draftProjectId"
  [projectSetByFolder]="isProjectSetByFolder"
  [busy]="isCreating"
  (closed)="handleClose()"
  (escapePressed)="handleEscape()"
  (editRequested)="handleEdit()"
  (cancelRequested)="handleCancel()"
  (saveRequested)="handleSave()"
  (deleteRequested)="handleDelete()"
  (deleteConfirmed)="handleConfirmDelete()"
  (deleteCancelled)="handleCancelDelete()"
  (projectChange)="handleProjectChange($event)"
  (createRequested)="handleCreate()"
  (discardConfirmed)="handleConfirmDiscard()"
  (discardCancelled)="handleCancelDiscard()"
  (conflictLoadLatest)="handleConflictLoadLatest()"
  (conflictOverwrite)="handleConflictOverwrite()"
  (conflictCancelled)="handleConflictCancel()"
  (draftProjectChange)="handleDraftProjectChange($event)"
>
  <app-flowchart-editor
    class="diagramDetail__editor"
    *ngIf="mode === 'view' && item"
    [content]="item.content"
    [editable]="false"
  ></app-flowchart-editor>
  <app-flowchart-editor
    class="diagramDetail__editor"
    *ngIf="mode === 'edit' || mode === 'create'"
    [content]="draftContent"
    [editable]="true"
    (contentChange)="handleContentChange($event)"
  ></app-flowchart-editor>
</app-item-detail-layout>
