<app-item-detail-layout
  *ngIf="item || mode === 'create'"
  [item]="item"
  favoriteType="Page"
  [titlePlaceholder]="PHRASES.PAGE_TITLE_PLACEHOLDER"
  [createHeading]="PHRASES.NEW_PAGE"
  [editingBannerText]="PHRASES.BEING_EDITED_BY"
  [discardConfirmMessage]="PHRASES.CONFIRM_DISCARD_NEW_PAGE"
  [mode]="mode"
  [(draftTitle)]="draftTitle"
  [editingNickname]="otherEditorNickname"
  [alertMessage]="alertMessage"
  [showDiscardConfirm]="showDiscardConfirm"
  [showEditConflict]="editConflict !== null"
  [draftProjectId]="draftProjectId"
  [projectSetByFolder]="isProjectSetByFolder"
  [busy]="isCreating"
  [autofocusTitle]="mode === 'create' && !isLoading"
  (closed)="handleClose()"
  (escapePressed)="handleEscape()"
  (editRequested)="handleEdit()"
  (cancelRequested)="handleCancel()"
  (saveRequested)="handleSave()"
  (deleteRequested)="handleDelete()"
  (copyLinkRequested)="handleCopyLink()"
  (projectChange)="handleProjectChange($event)"
  (createRequested)="handleCreate()"
  (discardConfirmed)="handleConfirmDiscard()"
  (discardCancelled)="handleCancelDiscard()"
  (conflictLoadLatest)="handleConflictLoadLatest()"
  (conflictOverwrite)="handleConflictOverwrite()"
  (conflictCancelled)="handleConflictCancel()"
  (draftProjectChange)="handleDraftProjectChange($event)"
>
  <div class="pageDetail" (dragover)="handleDragOver($event)" (drop)="handleDrop($event)" (paste)="handlePaste($event)">
    @defer {
      <app-rich-text-editor
        *ngIf="mode === 'view' && item"
        [content]="item.content"
        [editable]="false"
        [teamCode]="teamCode"
        [mentionContext]="mentionContext"
      ></app-rich-text-editor>
      <app-rich-text-editor
        *ngIf="(mode === 'edit' || mode === 'create') && !isLoading"
        [content]="draftContent"
        [editable]="true"
        [teamCode]="teamCode"
        [uploadImage]="uploadImage"
        [mentionContext]="mentionContext"
        [ariaLabel]="PHRASES.PAGE_CONTENT | translate"
        (contentChange)="handleContentChange($event)"
        (filesDropped)="uploadFiles($event)"
      ></app-rich-text-editor>
    }

    <app-attachment-list
      *ngIf="item || mode === 'create'"
      class="pageDetail__attachments"
      [teamCode]="teamCode"
      [attachments]="attachments"
      [uploads]="uploads"
      (filesSelected)="uploadFiles($event)"
      (deleteConfirmed)="handleDeleteAttachment($event)"
    ></app-attachment-list>
  </div>
  <app-comment-list class="pageDetail__comments" *ngIf="mode === 'view' && commentTarget" [target]="commentTarget" [mentionContext]="mentionContext"></app-comment-list>
</app-item-detail-layout>
