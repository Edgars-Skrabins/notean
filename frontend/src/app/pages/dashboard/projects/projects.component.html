<div class="dashboardStub">
  <div class="projects__header">
    <h2 class="dashboardStub__title">{{ PHRASES.PROJECTS | translate }}</h2>
    <app-button *ngIf="canCreate" variant="primary" icon="plus" (pressed)="handleNewProject()">{{ PHRASES.NEW_PROJECT | translate }}</app-button>
  </div>

  <input
    type="text"
    class="projects__search"
    [(ngModel)]="searchQuery"
    (ngModelChange)="handleSearchChange($event)"
    [placeholder]="PHRASES.SEARCH_PROJECTS | translate"
  />

  <ng-container *ngIf="projects">
    <div class="projects__list" *ngIf="projects.length">
      <button type="button" class="projects__row" *ngFor="let project of projects" (click)="handleOpenProject(project)">
        <span class="projects__text">
          <span class="projects__name">{{ project.name }}</span>
          <span class="projects__description">{{ descriptionText(project.description) }}</span>
        </span>
        <span class="projects__meta">
          <app-avatar [avatar]="project.owner.avatar" [nickname]="project.owner.nickname"></app-avatar>
          {{ project.owner.nickname }} · {{ PHRASES.MEMBER_COUNT | translate: {count: project.memberCount} }}
        </span>
      </button>
      <app-load-more *ngIf="hasMore" [loading]="isLoadingMore" (pressed)="handleLoadMore()"></app-load-more>
    </div>

    <ng-container *ngIf="!projects.length && !hasLoadError">
      <app-empty-state
        *ngIf="activeSearch"
        [title]="PHRASES.NO_MATCHES_TITLE"
        [titleParams]="{query: activeSearch}"
        [hint]="PHRASES.NO_MATCHES_PROJECTS_HINT"
      >
        <app-button variant="ghost" (pressed)="clearSearch()">{{ PHRASES.CLEAR_SEARCH | translate }}</app-button>
      </app-empty-state>

      <app-empty-state
        *ngIf="!activeSearch"
        [title]="PHRASES.NO_PROJECTS_YET"
        [hint]="canCreate ? PHRASES.CREATE_PROJECT_HINT : PHRASES.PROJECTS_EMPTY_MEMBER_HINT"
      >
        <app-button *ngIf="canCreate" variant="ghost" icon="plus" (pressed)="handleNewProject()">{{ PHRASES.NEW_PROJECT | translate }}</app-button>
      </app-empty-state>
    </ng-container>
  </ng-container>
</div>

<app-new-project-dialog
  *ngIf="isCreateDialogOpen"
  [members]="members"
  [currentUserId]="currentUserId"
  [nameError]="nameError"
  [busy]="isCreating"
  (confirmed)="handleCreate($event)"
  (cancelled)="handleCancelCreate()"
></app-new-project-dialog>
