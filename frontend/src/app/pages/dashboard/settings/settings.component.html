<button type="button" class="pageBackButton" (click)="handleGoBack()">
  <span class="pageBackButton__arrow" aria-hidden="true">&larr;</span>
  {{ PHRASES.BACK_TO_DASHBOARD | translate }}
</button>

<div class="settings">
  <h2 class="settings__title">{{ PHRASES.SETTINGS | translate }}</h2>

  <div class="settings__options">
    <app-checkbox
      [checked]="settings.showFavoritesOnHome"
      (checkedChange)="handleSettingChange('showFavoritesOnHome', $event)"
    >{{ PHRASES.SHOW_FAVORITES_ON_HOME | translate }}</app-checkbox>
    <app-checkbox
      [checked]="settings.showFavoritesInSidebar"
      (checkedChange)="handleSettingChange('showFavoritesInSidebar', $event)"
    >{{ PHRASES.SHOW_FAVORITES_IN_SIDEBAR | translate }}</app-checkbox>
    <app-checkbox
      [checked]="settings.showMyWorkOnHome"
      (checkedChange)="handleSettingChange('showMyWorkOnHome', $event)"
    >{{ PHRASES.SHOW_MY_WORK_ON_HOME | translate }}</app-checkbox>
  </div>

  <button class="authButton" [disabled]="!hasUnsavedChanges || isSaving" (click)="handleSave()">
    {{ PHRASES.SAVE | translate }}
  </button>
</div>

<app-confirm-dialog
  *ngIf="isLeaveConfirmOpen"
  [message]="PHRASES.CONFIRM_LEAVE_UNSAVED_CHANGES | translate"
  [confirmLabel]="PHRASES.LEAVE"
  (confirmed)="handleConfirmLeave()"
  (cancelled)="handleCancelLeave()"
></app-confirm-dialog>
