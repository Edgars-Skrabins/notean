<div class="diagramsView">
  <app-item-tabs [itemsLabel]="PHRASES.DIAGRAMS" [itemsRoute]="itemRoute"></app-item-tabs>

  <div class="diagramsView__toolbar">
    <input
      type="text"
      class="diagramsView__search"
      [(ngModel)]="searchQuery"
      (ngModelChange)="handleSearchChange($event)"
      [placeholder]="PHRASES.SEARCH_DIAGRAMS | translate"
    />
    <app-button variant="ghost" icon="folder-plus" (pressed)="handleCreateFolder(null)">{{ PHRASES.NEW_FOLDER | translate }}</app-button>
    <app-menu-button [customTrigger]="true" [options]="createOptions" (picked)="handleCreateChoice($event)">
      <app-button variant="primary" icon="plus">{{ PHRASES.NEW_DIAGRAM | translate }}</app-button>
    </app-menu-button>
  </div>

  <p class="authStatus" *ngIf="alertMessage">{{ alertMessage | translate }}</p>

  <app-item-tree
    *ngIf="!isLoading"
    [folders]="displayFolders"
    [items]="displayItems"
    [itemLabel]="PHRASES.NEW_DIAGRAM | translate"
    itemIcon="diagram"
    favoritableType="Diagram"
    [deleteItemConfirmMessage]="PHRASES.CONFIRM_DELETE_DIAGRAM | translate"
    (openItem)="handleOpenItem($event)"
    (createFolder)="handleCreateFolder($event.parentId)"
    (createItem)="handleCreateItem($event.parentId, $event.fromTemplate)"
    (renameFolder)="handleRenameFolder($event)"
    (renameItem)="handleRenameItem($event)"
    (deleteFolder)="handleDeleteFolder($event)"
    (deleteItem)="handleDeleteItem($event)"
    (moveItem)="handleMoveItem($event)"
    [canChangeFolderProject]="(projectFilterService.hasProjects$ | async) ?? false"
    (moveFolder)="handleMoveFolder($event)"
    (changeFolderProject)="handleChangeFolderProject($event)"
    [levels]="displayLevels"
    (expandFolder)="handleExpandFolder($event)"
    (loadMore)="handleLoadMore($event)"
  ></app-item-tree>

  <p class="dashboardStub__body" *ngIf="!isLoading && hasNoSearchResults">{{ PHRASES.NO_SEARCH_RESULTS | translate }}</p>
  <p class="dashboardStub__body" *ngIf="!isLoading && !isSearching && !displayFolders.length && !displayItems.length">{{ PHRASES.NO_DIAGRAMS_YET | translate }}</p>
</div>

<app-create-named-item-dialog
  *ngIf="isCreateFolderDialogOpen"
  [dialogTitle]="PHRASES.NEW_FOLDER | translate"
  [defaultValue]="PHRASES.UNTITLED_FOLDER | translate"
  [showProjectSelect]="isCreatingTopLevelFolder"
  [projectId]="defaultFolderProjectId"
  (confirmed)="handleCreateFolderConfirmed($event)"
  (cancelled)="handleCreateFolderCancelled()"
></app-create-named-item-dialog>

<app-folder-project-dialog
  *ngIf="folderPendingProjectChange"
  [folderTitle]="folderPendingProjectChange.title"
  [projectId]="folderPendingProjectChange.projectId"
  (confirmed)="handleFolderProjectConfirmed($event)"
  (cancelled)="handleFolderProjectCancelled()"
></app-folder-project-dialog>

<app-template-picker-dialog
  *ngIf="isTemplatePickerOpen"
  kind="diagram"
  (picked)="handleTemplatePicked($event)"
  (cancelled)="handleTemplatePickerCancelled()"
></app-template-picker-dialog>
