<button type="button" class="pageBackButton" (click)="handleGoBack()">
  <span class="pageBackButton__arrow" aria-hidden="true">&larr;</span>
  {{ PHRASES.BACK_TO_DASHBOARD | translate }}
</button>

<div class="profile">
  <h2 class="profile__title">{{ PHRASES.PROFILE | translate }}</h2>

  <div class="profile__avatar">
    <app-avatar
      [avatar]="previewAvatar"
      [nickname]="nickname"
      [previewUrl]="pendingImagePreviewUrl"
      [size]="96"
    ></app-avatar>

    <div class="profile__avatarActions">
      <input
        #imageInput
        class="profile__fileInput"
        type="file"
        [accept]="AVATAR_IMAGE_TYPES.join(',')"
        (change)="handleFileSelected($event)"
      />
      <app-button variant="ghost" (pressed)="imageInput.click()">{{ PHRASES.UPLOAD_IMAGE | translate }}</app-button>
      <app-button *ngIf="hasImage" variant="danger" (pressed)="handleRemoveImage()">{{ PHRASES.REMOVE_IMAGE | translate }}</app-button>
    </div>
  </div>

  <div class="authField">
    <span class="authField__label">{{ PHRASES.AVATAR_COLOR | translate }}</span>
    <div class="profile__swatches">
      <button
        *ngFor="let color of AVATAR_COLORS"
        type="button"
        class="profile__swatch"
        [class.profile__swatch--selected]="color.key === pendingColor"
        [style.background]="color.hex"
        [title]="color.phrase | translate"
        [attr.aria-label]="color.phrase | translate"
        (click)="handleSelectColor(color.key)"
      ></button>
    </div>
  </div>

  <div class="authField">
    <label class="authField__label" for="nicknameInput">{{ PHRASES.NICKNAME | translate }}</label>
    <input
      [(ngModel)]="nickname"
      [placeholder]="PHRASES.ENTER_NICKNAME | translate"
      id="nicknameInput"
      (keydown.enter)="handleSave()"
      type="text"
    />
  </div>

  <button class="authButton" [disabled]="!hasUnsavedChanges || isSaving" (click)="handleSave()">
    {{ PHRASES.SAVE | translate }}
  </button>

  <section class="profile__deleteAccount">
    <h3 class="profile__sectionTitle">{{ PHRASES.DELETE_ACCOUNT | translate }}</h3>
    <app-button variant="danger" [disabled]="isDeletingAccount" (pressed)="handleDeleteAccount()">{{ PHRASES.DELETE_ACCOUNT | translate }}</app-button>
  </section>
</div>

<app-confirm-dialog
  *ngIf="isDeleteAccountConfirmOpen"
  [message]="PHRASES.CONFIRM_DELETE_ACCOUNT | translate"
  [confirmLabel]="PHRASES.DELETE_ACCOUNT"
  (confirmed)="handleConfirmDeleteAccount()"
  (cancelled)="handleCancelDeleteAccount()"
></app-confirm-dialog>

<app-confirm-dialog
  *ngIf="isLeaveConfirmOpen"
  [message]="PHRASES.CONFIRM_LEAVE_UNSAVED_CHANGES | translate"
  [confirmLabel]="PHRASES.LEAVE"
  (confirmed)="handleConfirmLeave()"
  (cancelled)="handleCancelLeave()"
></app-confirm-dialog>
