<div class="ticketDetailOverlay" *ngIf="ticket">
  <div class="ticketDetailOverlay__backdrop" (click)="handleGoBack()"></div>

  <div class="ticketDetail">
    <div class="ticketDetail__header">
      <div class="ticketDetail__headerActions">
        <app-button *ngIf="ticket.columnId !== null" variant="ghost" icon="inbox" (pressed)="handleMoveToBacklog()">{{ PHRASES.MOVE_TO_BACKLOG | translate }}</app-button>
        <app-button *ngIf="ticket.columnId === null" variant="ghost" icon="columns" (pressed)="handleOpenMoveDialog()">{{ PHRASES.MOVE_TO_BOARD | translate }}</app-button>
        <app-favorite-star type="Ticket" [itemId]="ticket.id" [title]="ticket.title" [size]="36"></app-favorite-star>
        <app-icon-button
          icon="trash"
          variant="danger"
          [tooltip]="PHRASES.DELETE_TICKET | translate"
          (pressed)="handleDelete()"
        ></app-icon-button>
        <app-icon-button icon="link" [tooltip]="PHRASES.COPY_LINK | translate" (pressed)="handleCopyLink()"></app-icon-button>
        <app-icon-button icon="x" [tooltip]="PHRASES.CLOSE | translate" (pressed)="handleGoBack()"></app-icon-button>
      </div>
    </div>

    <p class="authStatus" *ngIf="alertMessage">{{ alertMessage | translate }}</p>

    <div class="ticketDetail__body" cdkScrollable>
      <div class="ticketDetail__main">
        <input
          type="text"
          class="ticketDetail__titleInput"
          [(ngModel)]="titleDraft"
          [maxlength]="TITLE_MAX_LENGTH"
          [placeholder]="PHRASES.TICKET_TITLE_PLACEHOLDER | translate"
          (keydown.enter)="commitTitle()"
          (keydown.escape)="cancelTitleEdit($event)"
          (focus)="handleTitleFocus()"
          (blur)="handleTitleBlur()"
        />

        <textarea
          class="ticketDetail__descriptionInput"
          [(ngModel)]="descriptionDraft"
          [maxlength]="DESCRIPTION_MAX_LENGTH"
          [placeholder]="PHRASES.TICKET_DESCRIPTION_PLACEHOLDER | translate"
          (keydown.escape)="cancelDescriptionEdit($event)"
          (focus)="handleDescriptionFocus()"
          (blur)="handleDescriptionBlur()"
        ></textarea>

        <app-comment-list *ngIf="commentTarget" [target]="commentTarget"></app-comment-list>
      </div>

      <div class="ticketDetail__side">
        <div class="ticketDetail__field">
          <h3 class="ticketDetail__fieldTitle">{{ PHRASES.PRIORITY | translate }}</h3>
          <app-dropdown
            class="ticketDetail__priority"
            [options]="priorityOptions"
            [value]="ticket.priorityId"
            [ariaLabel]="PHRASES.PRIORITY"
            (valueChange)="handlePriorityChange($event)"
          ></app-dropdown>
        </div>

        <app-ticket-assignees
          [assignees]="ticket.assignees"
          [members]="members"
          [currentUserId]="currentUserId"
          [busy]="isUpdatingAssignees"
          (add)="handleAddAssignee($event)"
          (remove)="handleRemoveAssignee($event)"
        ></app-ticket-assignees>
      </div>
    </div>
  </div>

  <app-move-to-board-dialog
    *ngIf="isMoveDialogOpen && state.board"
    [columns]="state.board.columns"
    (moved)="handleMoveToColumn($event)"
    (cancelled)="handleMoveCancelled()"
  ></app-move-to-board-dialog>

  <app-confirm-dialog
    *ngIf="showDeleteConfirm"
    [message]="PHRASES.CONFIRM_DELETE_TICKET | translate"
    (confirmed)="handleConfirmDelete()"
    (cancelled)="handleCancelDelete()"
  ></app-confirm-dialog>

  <app-edit-conflict-dialog
    *ngIf="editConflict"
    (loadLatest)="handleConflictLoadLatest()"
    (overwrite)="handleConflictOverwrite()"
    (cancelled)="handleConflictCancel()"
  ></app-edit-conflict-dialog>
</div>
