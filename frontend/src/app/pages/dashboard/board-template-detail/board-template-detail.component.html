<div class="boardTemplate">
  <div class="boardTemplate__header">
    <input
      *ngIf="canEdit"
      type="text"
      class="boardTemplate__title textInput"
      [(ngModel)]="title"
      [maxlength]="TITLE_MAX_LENGTH"
      [placeholder]="PHRASES.TEMPLATE_NAME_PLACEHOLDER | translate"
      [attr.aria-label]="PHRASES.TEMPLATE_NAME_PLACEHOLDER | translate"
    />
    <h1 *ngIf="!canEdit" class="boardTemplate__heading">{{ title }}</h1>

    <div class="boardTemplate__actions" *ngIf="isNew">
      <app-button variant="ghost" (pressed)="handleBack()">{{ PHRASES.CANCEL | translate }}</app-button>
      <app-button variant="primary" [disabled]="isSaving || isLoading" (pressed)="handleCreate()">{{ PHRASES.CREATE | translate }}</app-button>
    </div>
    <div class="boardTemplate__actions" *ngIf="!isNew && template?.canManage">
      <app-button variant="ghost" (pressed)="handleDelete()">{{ PHRASES.DELETE | translate }}</app-button>
      <app-button variant="primary" [disabled]="isSaving" (pressed)="handleSave()">{{ PHRASES.SAVE | translate }}</app-button>
    </div>
    <app-icon-button icon="x" [tooltip]="PHRASES.CLOSE | translate" (pressed)="handleBack()"></app-icon-button>
  </div>

  <p class="authStatus" *ngIf="alertMessage">{{ alertMessage | translate }}</p>

  <div class="boardTemplate__sections" *ngIf="!isLoading && (isNew || template)">
    <app-template-rows
      [rows]="columns"
      [label]="PHRASES.COLUMNS"
      [addLabel]="PHRASES.ADD_COLUMN"
      [removeLabel]="PHRASES.REMOVE_COLUMN"
      [maxLength]="TITLE_MAX_LENGTH"
      [readonly]="!canEdit"
      (added)="handleAddColumn()"
    ></app-template-rows>
    <app-template-rows
      [rows]="priorities"
      [label]="PHRASES.PRIORITIES"
      [addLabel]="PHRASES.ADD_PRIORITY"
      [removeLabel]="PHRASES.DELETE_PRIORITY"
      [maxLength]="PRIORITY_NAME_MAX_LENGTH"
      [readonly]="!canEdit"
      (added)="handleAddPriority()"
    ></app-template-rows>
    <app-template-rows
      [rows]="tags"
      [label]="PHRASES.TAGS"
      [addLabel]="PHRASES.ADD_TAG"
      [removeLabel]="PHRASES.DELETE_TAG"
      [maxLength]="TAG_NAME_MAX_LENGTH"
      [readonly]="!canEdit"
      [chipPreview]="true"
      (added)="handleAddTag()"
    ></app-template-rows>
  </div>
</div>

<app-confirm-dialog
  *ngIf="showDeleteConfirm"
  [message]="PHRASES.CONFIRM_DELETE_TEMPLATE | translate"
  (confirmed)="handleConfirmDelete()"
  (cancelled)="handleCancelDelete()"
></app-confirm-dialog>

<app-edit-conflict-dialog
  *ngIf="editConflict"
  (loadLatest)="handleConflictLoadLatest()"
  (overwrite)="handleConflictOverwrite()"
  (cancelled)="handleConflictCancel()"
></app-edit-conflict-dialog>
