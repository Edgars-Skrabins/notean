<div class="dashboardShell">
  <div class="dashboardShell__backdrop" aria-hidden="true">
    <svg class="dashboardShell__waves" viewBox="0 0 1440 400" preserveAspectRatio="none">
      <path class="dashboardShell__wave dashboardShell__wave--back"
            d="M0,220 C240,160 480,260 720,200 C960,140 1200,240 1440,180 L1440,400 L0,400 Z"/>
      <path class="dashboardShell__wave dashboardShell__wave--mid"
            d="M0,260 C200,320 400,200 640,260 C880,320 1080,220 1440,260 L1440,400 L0,400 Z"/>
      <path class="dashboardShell__wave dashboardShell__wave--front"
            d="M0,300 C300,340 600,280 900,320 C1100,345 1300,300 1440,320 L1440,400 L0,400 Z"/>
    </svg>
  </div>

  <app-dashboard-header [compact]="isCompact" [navOpen]="isNavOpen" (navToggle)="toggleNav()"></app-dashboard-header>

  <div class="dashboardShell__body">
    <div
      class="dashboardShell__nav"
      [class.dashboardShell__nav--compact]="isCompact"
      [class.dashboardShell__nav--open]="isNavOpen"
      [cdkTrapFocus]="isCompact && isNavOpen"
      [attr.role]="isCompact ? 'dialog' : null"
      [attr.aria-modal]="isCompact ? 'true' : null"
      [attr.aria-label]="isCompact ? (PHRASES.NAVIGATION | translate) : null"
    >
      <app-dashboard-sidebar [compact]="isCompact" (closeRequested)="closeNav(true)"></app-dashboard-sidebar>
    </div>
    <div class="dashboardShell__scrim" *ngIf="isCompact && isNavOpen" (click)="closeNav(true)"></div>

    <div class="dashboardShell__content">
      <router-outlet/>
    </div>
  </div>
</div>
