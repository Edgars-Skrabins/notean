<div class="cardDetailOverlay" *ngIf="card">
  <div class="cardDetailOverlay__backdrop" (click)="handleGoBack()"></div>

  <div class="cardDetail">
    <div class="cardDetail__header">
      <app-icon-button icon="x" [tooltip]="PHRASES.CLOSE | translate" (pressed)="handleGoBack()"></app-icon-button>

      <app-icon-button
        icon="trash"
        variant="danger"
        [tooltip]="PHRASES.DELETE_CARD | translate"
        (pressed)="handleDelete()"
      ></app-icon-button>
    </div>

    <p class="authStatus" *ngIf="alertMessage">{{ alertMessage }}</p>

    <div class="cardDetail__body">
      <input
        type="text"
        class="cardDetail__titleInput"
        [(ngModel)]="titleDraft"
        [placeholder]="PHRASES.CARD_TITLE_PLACEHOLDER | translate"
        (keydown.enter)="commitTitle()"
        (keydown.escape)="cancelTitleEdit()"
        (blur)="commitTitle()"
      />

      <textarea
        class="cardDetail__descriptionInput"
        [(ngModel)]="descriptionDraft"
        [placeholder]="PHRASES.CARD_DESCRIPTION_PLACEHOLDER | translate"
        (keydown.escape)="cancelDescriptionEdit()"
        (blur)="commitDescription()"
      ></textarea>
    </div>
  </div>

  <app-confirm-dialog
    *ngIf="showDeleteConfirm"
    [message]="PHRASES.CONFIRM_DELETE_CARD | translate"
    (confirmed)="handleConfirmDelete()"
    (cancelled)="handleCancelDelete()"
  ></app-confirm-dialog>
</div>
