<ng-container *ngIf="teamService.features$ | async as features">
  <div class="dashboardStub" *ngIf="settingsService.settings$ | async as settings">
    <h1 class="dashboardStub__title">{{ PHRASES.HOME | translate }}</h1>
    <app-activity-inbox></app-activity-inbox>
    <app-favorites-grid *ngIf="settings.showFavoritesOnHome"></app-favorites-grid>
    <app-my-work *ngIf="settings.showMyWorkOnHome && features.boards"></app-my-work>
  </div>
</ng-container>
