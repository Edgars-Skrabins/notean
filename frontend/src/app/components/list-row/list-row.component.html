<div class="listRow" [class.listRow--selected]="selected">
  <app-checkbox
    class="listRow__checkbox"
    [checked]="selected"
    [ariaLabel]="PHRASES.SELECT_TICKET | translate"
    (checkedChange)="selectedChange.emit($event)"
  ></app-checkbox>

  <button type="button" class="listRow__main" (click)="opened.emit()">
    <span class="listRow__title">{{ ticket.title }}</span>
  </button>

  <span class="listRow__status">{{ statusTitle }}</span>
  <span class="listRow__date">{{ ticket.createdAt | date: 'mediumDate' }}</span>
  <app-avatar-stack class="listRow__assignees" [users]="ticket.assignees"></app-avatar-stack>

  <div class="listRow__actions">
    <app-favorite-star type="Ticket" [itemId]="ticket.id" [title]="ticket.title"></app-favorite-star>
    <app-icon-button
      *ngIf="ticket.columnId === null"
      icon="columns"
      [size]="28"
      [tooltip]="PHRASES.MOVE_TO_BOARD | translate"
      (pressed)="moveToBoard.emit()"
    ></app-icon-button>
    <app-icon-button icon="trash" variant="danger" [size]="28" [tooltip]="PHRASES.DELETE_TICKET | translate" (pressed)="deleteTicket.emit()"></app-icon-button>
  </div>
</div>
