<div class="themeModeSwitch" role="radiogroup" [attr.aria-label]="PHRASES.THEME_MODE | translate">
  <label
    *ngFor="let option of options"
    class="themeModeSwitch__option"
    [class.themeModeSwitch__option--active]="option.mode === mode"
  >
    <input
      type="radio"
      class="cdk-visually-hidden"
      name="themeMode"
      [value]="option.mode"
      [checked]="option.mode === mode"
      (change)="select(option.mode)"
    />{{ option.phrase | translate }}</label>
</div>
