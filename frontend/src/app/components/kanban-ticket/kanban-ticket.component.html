<div class="kanbanTicket">
  <button type="button" class="kanbanTicket__main" (click)="opened.emit()">
    <span class="kanbanTicket__title">{{ ticket.title }}</span>
  </button>

  <div class="kanbanTicket__actions">
    <app-favorite-star type="Ticket" [itemId]="ticket.id" [title]="ticket.title"></app-favorite-star>
    <app-icon-button
      icon="inbox"
      [size]="28"
      [tooltip]="PHRASES.MOVE_TO_BACKLOG | translate"
      (pressed)="moveToBacklog.emit()"
    ></app-icon-button>
    <app-icon-button
      icon="trash"
      variant="danger"
      [size]="28"
      [tooltip]="PHRASES.DELETE_TICKET | translate"
      (pressed)="deleteTicket.emit()"
    ></app-icon-button>
  </div>
</div>
