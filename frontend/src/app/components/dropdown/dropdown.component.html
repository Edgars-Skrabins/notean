<button
  type="button"
  class="dropdown__trigger"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  aria-haspopup="listbox"
  [attr.aria-expanded]="isOpen"
  [attr.aria-label]="ariaLabel ? (ariaLabel | translate) : null"
  (click)="toggle()"
  (keydown)="handleKeydown($event)"
>
  <span class="priorityDot" *ngIf="selectedOption?.color" [attr.data-color]="selectedOption?.color"></span>
  <span class="dropdown__label" *ngIf="selectedOption as option">{{ option.labelKey ? (option.labelKey | translate) : option.label }}</span>
  <app-icon class="dropdown__chevron" [class.dropdown__chevron--open]="isOpen" name="chevron-right"></app-icon>
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="isOpen"
  [cdkConnectedOverlayPositions]="DROPDOWN_POSITIONS"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="4"
  [cdkConnectedOverlayMinWidth]="triggerWidth"
  (overlayOutsideClick)="handleOutsideClick($event)"
  (detach)="close()"
>
  <ul
    class="dropdown__panel"
    role="listbox"
    [attr.aria-activedescendant]="optionId(activeIndex)"
    (mousedown)="$event.preventDefault()"
  >
    <li
      *ngFor="let option of options; let index = index; trackBy: trackByValue"
      role="option"
      class="dropdown__option"
      [id]="optionId(index)"
      [attr.aria-selected]="option.value === value"
      [class.dropdown__option--active]="index === activeIndex"
      (mouseenter)="activeIndex = index"
      (click)="select(option)"
    >
      <span class="priorityDot" *ngIf="option.color" [attr.data-color]="option.color"></span>
      <span class="dropdown__optionLabel">{{ option.labelKey ? (option.labelKey | translate) : option.label }}</span>
      <svg *ngIf="option.value === value" class="dropdown__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </li>
  </ul>
</ng-template>
