<div class="confirmDialogOverlay" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
  <div class="confirmDialogOverlay__backdrop" (click)="handleCancel()"></div>

  <div class="confirmDialog" role="alertdialog" aria-modal="true" [attr.aria-labelledby]="messageId" tabindex="-1">
    <p class="confirmDialog__message" [id]="messageId">{{ message }}</p>

    <div class="confirmDialog__actions">
      <app-button variant="ghost" [initialFocus]="true" (pressed)="handleCancel()">{{ PHRASES.CANCEL | translate }}</app-button>
      <app-button [variant]="confirmVariant" (pressed)="handleConfirm()">{{ confirmLabel | translate }}</app-button>
    </div>
  </div>
</div>
