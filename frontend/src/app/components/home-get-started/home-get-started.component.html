<section class="homeGetStarted">
  <div class="homeGetStarted__header">
    <h3 class="homeGetStarted__title">{{ PHRASES.GET_STARTED_TITLE | translate }}</h3>
    <app-icon-button
      icon="x"
      [size]="28"
      [tooltip]="PHRASES.HIDE_GET_STARTED | translate"
      (pressed)="dismissed.emit()"
    ></app-icon-button>
  </div>
  <p class="homeGetStarted__hint">{{ PHRASES.GET_STARTED_HINT | translate }}</p>
  <div class="homeGetStarted__actions">
    <app-button
      *ngFor="let action of actions"
      variant="ghost"
      [icon]="ACTION_BUTTONS[action].icon"
      (pressed)="handleAction(action)"
    >{{ ACTION_BUTTONS[action].phrase | translate }}</app-button>
  </div>
</section>

<app-create-board-dialog
  *ngIf="isCreateBoardOpen"
  (created)="handleBoardCreated($event)"
  (cancelled)="isCreateBoardOpen = false"
></app-create-board-dialog>
