<h3 class="ticketAssignees__title">{{ PHRASES.ASSIGNEES | translate }}</h3>

<div class="ticketAssignees__row" *ngFor="let assignee of assignees">
  <app-avatar [avatar]="assignee.avatar" [nickname]="assignee.nickname"></app-avatar>
  <span class="ticketAssignees__name">{{ assignee.nickname }}</span>
  <app-icon-button
    icon="x"
    [size]="28"
    [disabled]="busy"
    [tooltip]="PHRASES.REMOVE_ASSIGNEE | translate"
    (pressed)="remove.emit(assignee.id)"
  ></app-icon-button>
</div>

<p class="ticketAssignees__empty" *ngIf="!assignees.length">{{ PHRASES.UNASSIGNED | translate }}</p>

<button type="button" class="ticketAssignees__link" *ngIf="!isCurrentUserAssigned" [disabled]="busy" (click)="add.emit(currentUserId)">
  {{ PHRASES.ASSIGN_TO_ME | translate }}
</button>

<button
  type="button"
  class="ticketAssignees__link ticketAssignees__trigger"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  [disabled]="busy"
  (click)="togglePicker()"
>
  + {{ PHRASES.ADD_ASSIGNEE | translate }}
</button>

<ng-template
  cdkConnectedOverlay
  #overlay="cdkConnectedOverlay"
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="isPickerOpen"
  [cdkConnectedOverlayPositions]="DROPDOWN_POSITIONS"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="4"
  (overlayOutsideClick)="handleOutsideClick($event)"
  (attach)="focusSearch(overlay)"
  (detach)="closePicker()"
>
  <div class="ticketAssignees__dropdown" (keydown.escape)="closePicker(); $event.preventDefault()">
    <input
      type="text"
      class="ticketAssignees__search"
      [(ngModel)]="searchQuery"
      [placeholder]="PHRASES.SEARCH_MEMBERS | translate"
    />
    <button type="button" class="ticketAssignees__option" *ngFor="let member of availableMembers" (click)="handlePick(member)">
      <app-avatar [avatar]="member.avatar" [nickname]="member.nickname"></app-avatar>
      {{ member.nickname }}
    </button>
    <p class="ticketAssignees__empty" *ngIf="!availableMembers.length">{{ PHRASES.NO_MATCHING_MEMBERS | translate }}</p>
  </div>
</ng-template>
