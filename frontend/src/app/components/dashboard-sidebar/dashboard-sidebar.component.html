<nav class="dashboardSidebar" [class.dashboardSidebar--collapsed]="collapsed">
  <a class="dashboardSidebar__item" [routerLink]="AppRoutes.DASHBOARD_HOME" routerLinkActive="dashboardSidebar__item--active" [appTooltip]="collapsed ? (PHRASES.HOME | translate) : ''" [attr.aria-label]="PHRASES.HOME | translate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12l9-9 9 9"></path>
      <path d="M5 10v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V10"></path>
    </svg>
    <span class="dashboardSidebar__label">{{ PHRASES.HOME | translate }}</span>
  </a>

  <a class="dashboardSidebar__item" [routerLink]="AppRoutes.PROJECTS" routerLinkActive="dashboardSidebar__item--active" [appTooltip]="collapsed ? (PHRASES.PROJECTS | translate) : ''" [attr.aria-label]="PHRASES.PROJECTS | translate">
    <app-icon name="project" class="dashboardSidebar__icon"></app-icon>
    <span class="dashboardSidebar__label">{{ PHRASES.PROJECTS | translate }}</span>
  </a>

  <a class="dashboardSidebar__item" [routerLink]="AppRoutes.DOCUMENT_PAGES" routerLinkActive="dashboardSidebar__item--active" [appTooltip]="collapsed ? (PHRASES.DOCUMENT_PAGES | translate) : ''" [attr.aria-label]="PHRASES.DOCUMENT_PAGES | translate">
    <app-icon name="page" class="dashboardSidebar__icon"></app-icon>
    <span class="dashboardSidebar__label">{{ PHRASES.DOCUMENT_PAGES | translate }}</span>
  </a>

  <a class="dashboardSidebar__item" [routerLink]="AppRoutes.DIAGRAMS" routerLinkActive="dashboardSidebar__item--active" [appTooltip]="collapsed ? (PHRASES.DIAGRAMS | translate) : ''" [attr.aria-label]="PHRASES.DIAGRAMS | translate">
    <app-icon name="diagram" class="dashboardSidebar__icon"></app-icon>
    <span class="dashboardSidebar__label">{{ PHRASES.DIAGRAMS | translate }}</span>
  </a>

  <app-sidebar-boards [collapsed]="collapsed"></app-sidebar-boards>

  <app-favorites-list *ngIf="!collapsed && (settingsService.settings$ | async)?.showFavoritesInSidebar"></app-favorites-list>

  <button
    type="button"
    class="dashboardSidebar__toggle"
    (click)="toggleCollapsed()"
    [title]="(collapsed ? PHRASES.EXPAND_SIDEBAR : PHRASES.COLLAPSE_SIDEBAR) | translate"
    [attr.aria-label]="(collapsed ? PHRASES.EXPAND_SIDEBAR : PHRASES.COLLAPSE_SIDEBAR) | translate"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
    <span class="dashboardSidebar__label">{{ PHRASES.COLLAPSE_SIDEBAR | translate }}</span>
  </button>
</nav>
