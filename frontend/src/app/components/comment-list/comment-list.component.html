<section class="commentList">
  <h3 class="commentList__title capsLabel" *ngIf="title">{{ title | translate }}</h3>

  <p class="errorMessage" role="alert" *ngIf="alertMessage">{{ alertMessage | translate }}</p>

  <app-load-more *ngIf="hasMore" [loading]="isLoadingMore" (pressed)="loadMore()"></app-load-more>

  <p class="commentList__empty" *ngIf="isLoaded && comments.length === 0 && !alertMessage">{{ PHRASES.NO_COMMENTS_YET | translate }}</p>

  <app-comment-item
    *ngFor="let comment of comments; trackBy: trackById"
    [comment]="comment"
    [teamCode]="teamCode"
    [mentionContext]="mentionContext"
    [canEdit]="canEdit(comment)"
    [canDelete]="canDelete(comment)"
    (updated)="handleUpdated($event)"
    (deleted)="handleDeleted(comment, $event)"
    (failed)="showError($event)"
  ></app-comment-item>

  <button #composerTrigger type="button" class="commentList__trigger textInput" *ngIf="isLoaded && !isComposerOpen" (click)="openComposer()">{{ placeholder | translate }}</button>

  <div class="commentList__new" *ngIf="isLoaded && isComposerOpen" (focusout)="handleComposerFocusOut($event)">
    <app-rich-text-editor [content]="draft" [compact]="true" [mentionContext]="mentionContext" [autofocus]="true" [ariaLabel]="PHRASES.WRITE_COMMENT | translate" (contentChange)="draft = $event"></app-rich-text-editor>
    <div class="commentList__actions">
      <app-button variant="ghost" (pressed)="cancelComposer()">{{ PHRASES.CANCEL | translate }}</app-button>
      <app-button [disabled]="!canPost" (pressed)="post()">{{ submitLabel | translate }}</app-button>
    </div>
  </div>
</section>
