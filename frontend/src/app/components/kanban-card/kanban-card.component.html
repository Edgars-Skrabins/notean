<div class="kanbanCard">
  <button type="button" class="kanbanCard__main" (click)="opened.emit()">
    <span class="kanbanCard__title">{{ card.title }}</span>
  </button>

  <div class="kanbanCard__actions">
    <app-icon-button
      icon="trash"
      variant="danger"
      [size]="28"
      [tooltip]="PHRASES.DELETE_CARD | translate"
      (pressed)="deleteCard.emit()"
    ></app-icon-button>
  </div>
</div>
