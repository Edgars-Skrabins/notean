<div class="kanbanColumn">
  <div class="kanbanColumn__header">
    <span *ngIf="!isRenaming" class="kanbanColumn__title">{{ column.title }}</span>
    <input
      *ngIf="isRenaming"
      type="text"
      class="kanbanColumn__titleInput"
      [(ngModel)]="renameDraft"
      [maxlength]="TITLE_MAX_LENGTH"
      (keydown.enter)="commitRename()"
      (keydown.escape)="cancelRename(); $event.preventDefault()"
      (blur)="commitRename()"
      autofocus
    />

    <div class="kanbanColumn__actions">
      <app-icon-button
        icon="edit"
        [tooltip]="PHRASES.RENAME_COLUMN | translate"
        [size]="28"
        (pressed)="startRename()"
      ></app-icon-button>
      <app-icon-button
        icon="trash"
        variant="danger"
        [tooltip]="PHRASES.DELETE_COLUMN | translate"
        [size]="28"
        (pressed)="deleteColumn.emit()"
      ></app-icon-button>
    </div>
  </div>

  <div
    class="kanbanColumn__body"
    cdkDropList
    [cdkDropListData]="column.tickets"
    (cdkDropListDropped)="ticketDropped.emit($event)"
  >
    <app-kanban-ticket
      *ngFor="let ticket of column.tickets"
      cdkDrag
      [cdkDragData]="ticket"
      [ticket]="ticket"
      (opened)="openTicket.emit(ticket)"
      (moveToBacklog)="moveTicketToBacklog.emit(ticket)"
      (deleteTicket)="deleteTicket.emit(ticket)"
    ></app-kanban-ticket>
  </div>

  <app-button variant="ghost" icon="plus" class="kanbanColumn__addTicket" (pressed)="addTicket.emit()">
    {{ PHRASES.ADD_TICKET | translate }}
  </app-button>
</div>
