<div class="authField">
  <label class="authField__label" for="projectName">{{ PHRASES.PROJECT_NAME | translate }}</label>
  <input
    *ngIf="!readonly"
    id="projectName"
    type="text"
    [ngModel]="params.name"
    (ngModelChange)="handleNameChange($event)"
    [maxlength]="TITLE_MAX_LENGTH"
  />
  <p class="projectForm__value" *ngIf="readonly">{{ params.name }}</p>
  <p class="projectForm__error" *ngIf="nameError">{{ nameError | translate }}</p>
</div>

<div class="authField">
  <label class="authField__label" for="projectDescription">{{ PHRASES.PROJECT_DESCRIPTION | translate }}</label>
  <app-mention-text-editor
    *ngIf="!readonly"
    inputId="projectDescription"
    [value]="params.description"
    [maxLength]="DESCRIPTION_MAX_LENGTH"
    [mentionContext]="mentionContext"
    (valueChange)="handleDescriptionChange($event)"
  ></app-mention-text-editor>
  <ng-container *ngIf="readonly">
    <app-mention-content class="projectForm__value" *ngIf="params.description; else noDescription" [text]="params.description"></app-mention-content>
    <ng-template #noDescription><p class="projectForm__value">—</p></ng-template>
  </ng-container>
</div>

<div class="authField">
  <span class="authField__label">{{ PHRASES.PROJECT_OWNER | translate }}</span>
  <app-dropdown
    *ngIf="!readonly"
    class="projectForm__owner"
    [options]="ownerOptions"
    [value]="params.ownerUserId"
    [ariaLabel]="PHRASES.PROJECT_OWNER"
    (valueChange)="handleOwnerChange($any($event))"
  ></app-dropdown>
  <p class="projectForm__value" *ngIf="readonly">{{ ownerNickname }}</p>
</div>

<div class="authField">
  <span class="authField__label">{{ PHRASES.PROJECT_MEMBERS | translate }}</span>
  <ng-container *ngIf="!readonly">
    <app-checkbox
      *ngFor="let member of members"
      [checked]="isMember(member.id)"
      [disabled]="member.id === params.ownerUserId"
      (checkedChange)="handleMemberToggle(member.id, $event)"
    >
      <span class="projectForm__member">
        <app-avatar [avatar]="member.avatar" [nickname]="member.nickname"></app-avatar>
        {{ member.nickname }}
      </span>
    </app-checkbox>
  </ng-container>
  <p class="projectForm__value" *ngIf="readonly">{{ memberNicknames }}</p>
</div>
