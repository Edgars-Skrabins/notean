<ng-template #levelTemplate let-folders let-items="items" let-depth="depth" let-level="level">
  <ng-container *ngFor="let folder of folders">
    <app-item-tree-row
      cdkDrag
      [cdkDragData]="toFolderDrag(folder)"
      (cdkDragStarted)="handleDragStarted(toFolderDrag(folder))"
      (cdkDragMoved)="handleDragMoved($event)"
      (cdkDragEnded)="handleDragEnded($event)"
      [attr.data-drop-folder-id]="folder.id"
      class="itemTree__row itemTree__row--folder"
      [class.itemTree__row--invalidTarget]="isDropZoneInvalid(toFolderDrop(folder))"
      [class.itemTree__row--hoverTarget]="isHovered(toFolderDrop(folder))"
      [style.paddingLeft.px]="depth * 20"
      (click)="handleFolderRowClick($event, folder)"
      kind="folder"
      icon="folder"
      [title]="folder.title"
      [expandable]="canExpand(folder)"
      [expanded]="isExpanded(folder.id)"
      [renaming]="renamingFolderId === folder.id"
      [(renameDraft)]="renameDraftTitle"
      (activate)="toggleExpand(folder)"
      (renameCommit)="commitRenameFolder(folder)"
      (renameCancel)="cancelRenameFolder()"
    >
      <div class="itemTree__rowActions">
        <app-icon-button
          icon="folder-plus"
          [tooltip]="PHRASES.NEW_FOLDER | translate"
          [size]="28"
          (pressed)="createFolder.emit({ parentId: folder.id })"
        ></app-icon-button>
        <app-menu-button [customTrigger]="true" [options]="createOptions" (picked)="handleCreateChoice(folder.id, $event)">
          <app-icon-button icon="plus" [tooltip]="itemLabel" [size]="28"></app-icon-button>
        </app-menu-button>
        <app-icon-button
          *ngIf="canChangeFolderProject && folder.parentId === null"
          icon="project"
          [tooltip]="PHRASES.CHANGE_FOLDER_PROJECT | translate"
          [size]="28"
          (pressed)="changeFolderProject.emit({ folderId: folder.id })"
        ></app-icon-button>
        <app-icon-button
          icon="edit"
          [tooltip]="PHRASES.RENAME_FOLDER | translate"
          [size]="28"
          (pressed)="startRenameFolder(folder)"
        ></app-icon-button>
        <app-icon-button
          icon="trash"
          variant="danger"
          [tooltip]="PHRASES.DELETE_FOLDER | translate"
          [size]="28"
          (pressed)="requestDeleteFolder(folder)"
        ></app-icon-button>
      </div>
    </app-item-tree-row>

    <ng-container *ngIf="isExpanded(folder.id)">
      <ng-container
        *ngTemplateOutlet="levelTemplate; context: { $implicit: folder.children, items: folder.items, depth: depth + 1, level: folder.id }"
      ></ng-container>
    </ng-container>
  </ng-container>

  <ng-container *ngFor="let item of items">
    <app-item-tree-row
      cdkDrag
      [cdkDragData]="toItemDrag(item)"
      (cdkDragStarted)="handleDragStarted(toItemDrag(item))"
      (cdkDragMoved)="handleDragMoved($event)"
      (cdkDragEnded)="handleDragEnded($event)"
      class="itemTree__row itemTree__row--item"
      [style.paddingLeft.px]="depth * 20"
      (click)="handleItemRowClick($event, item)"
      kind="item"
      [icon]="itemIcon"
      [title]="item.title"
      [renaming]="renamingItemId === item.id"
      [(renameDraft)]="renameItemDraftTitle"
      (activate)="openItem.emit(item)"
      (renameCommit)="commitRenameItem(item)"
      (renameCancel)="cancelRenameItem()"
    >
      <span rowMeta class="itemTree__rowMeta">{{ item.meta.creator.nickname }} &middot; {{ item.meta.updatedAt | date }}</span>

      <div class="itemTree__rowActions">
        <app-icon-button
          icon="edit"
          [tooltip]="PHRASES.RENAME_ITEM | translate"
          [size]="28"
          (pressed)="startRenameItem(item)"
        ></app-icon-button>
        <app-favorite-star [type]="favoritableType" [itemId]="item.id" [title]="item.title"></app-favorite-star>
        <app-icon-button
          icon="trash"
          variant="danger"
          [tooltip]="PHRASES.DELETE | translate"
          [size]="28"
          (pressed)="requestDeleteItem(item)"
        ></app-icon-button>
      </div>
    </app-item-tree-row>
  </ng-container>

  <app-load-more
    *ngIf="levelState(level)?.hasMore"
    [loading]="levelState(level)?.isLoading ?? false"
    [style.paddingLeft.px]="depth * 20"
    (pressed)="loadMore.emit({ level })"
  ></app-load-more>
</ng-template>

<div class="itemTree">
  <div
    data-drop-root
    class="itemTree__rootDropZone"
    [class.itemTree__rootDropZone--active]="draggingNode !== null"
    [class.itemTree__rootDropZone--hoverTarget]="isHovered(rootTarget)"
  ></div>

  <ng-container
    *ngTemplateOutlet="levelTemplate; context: { $implicit: rootFolders, items: rootItems, depth: 0, level: 'root' }"
  ></ng-container>
</div>

<app-delete-folder-dialog
  *ngIf="folderPendingDeletion"
  [folderTitle]="folderPendingDeletion.title"
  (confirmed)="handleDeleteConfirmed($event)"
  (cancelled)="handleDeleteCancelled()"
></app-delete-folder-dialog>

<app-confirm-dialog
  *ngIf="itemPendingDeletion"
  [message]="deleteItemConfirmMessage"
  (confirmed)="handleDeleteItemConfirmed()"
  (cancelled)="handleDeleteItemCancelled()"
></app-confirm-dialog>
