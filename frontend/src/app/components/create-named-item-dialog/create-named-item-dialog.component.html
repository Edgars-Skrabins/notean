<div class="createNamedItemDialogOverlay" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
  <div class="createNamedItemDialogOverlay__backdrop" (click)="handleCancel()"></div>

  <div class="createNamedItemDialog" role="dialog" aria-modal="true" [attr.aria-labelledby]="titleId" tabindex="-1">
    <h3 class="createNamedItemDialog__title" [id]="titleId">{{ dialogTitle }}</h3>

    <input
      type="text"
      class="createNamedItemDialog__input"
      [(ngModel)]="itemTitle"
      [maxlength]="TITLE_MAX_LENGTH"
      [placeholder]="defaultValue"
      [attr.aria-invalid]="errorMessage ? true : null"
      [attr.aria-describedby]="errorMessage ? 'createNamedItemError' : null"
      [attr.aria-labelledby]="titleId"
      cdkFocusInitial
    />

    <app-project-select
      *ngIf="showProjectSelect && (projectFilterService.hasProjects$ | async)"
      class="createNamedItemDialog__project"
      [projectId]="selectedProjectId"
      (projectChange)="selectedProjectId = $event"
    ></app-project-select>

    <ng-content></ng-content>

    <p class="errorMessage createNamedItemDialog__error" role="alert" id="createNamedItemError" *ngIf="errorMessage">{{ errorMessage | translate }}</p>

    <div class="createNamedItemDialog__actions">
      <app-button variant="ghost" (pressed)="handleCancel()">{{ PHRASES.CANCEL | translate }}</app-button>
      <app-button variant="primary" (pressed)="handleConfirm()">{{ confirmLabel | translate }}</app-button>
    </div>
  </div>
</div>
