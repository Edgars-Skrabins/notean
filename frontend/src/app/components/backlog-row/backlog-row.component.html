<div class="backlogRow">
  <button type="button" class="backlogRow__main" (click)="opened.emit()">
    <span class="backlogRow__title">{{ ticket.title }}</span>
  </button>

  <div class="backlogRow__actions">
    <app-favorite-star type="Ticket" [itemId]="ticket.id" [title]="ticket.title"></app-favorite-star>
    <app-icon-button icon="columns" [size]="28" [tooltip]="PHRASES.MOVE_TO_BOARD | translate" (pressed)="moveToBoard.emit()"></app-icon-button>
    <app-icon-button icon="trash" variant="danger" [size]="28" [tooltip]="PHRASES.DELETE_TICKET | translate" (pressed)="deleteTicket.emit()"></app-icon-button>
  </div>
</div>
