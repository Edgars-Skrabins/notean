<div class="deleteFolderDialogOverlay" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
  <div class="deleteFolderDialogOverlay__backdrop" (click)="handleCancel()"></div>

  <div class="deleteFolderDialog" role="dialog" aria-modal="true" [attr.aria-labelledby]="titleId" tabindex="-1">
    <h3 class="deleteFolderDialog__title" [id]="titleId">{{ PHRASES.DELETE_FOLDER_CONFIRM_TITLE | translate }} '{{ folderTitle }}'?</h3>

    <app-checkbox
      class="deleteFolderDialog__checkboxRow"
      [checked]="deleteNestedContents"
      (checkedChange)="deleteNestedContents = $event"
    >{{ PHRASES.DELETE_FOLDER_KEEP_CONTENTS_CHECKBOX | translate }}</app-checkbox>

    <div class="deleteFolderDialog__actions">
      <app-button variant="ghost" [initialFocus]="true" (pressed)="handleCancel()">{{ PHRASES.CANCEL | translate }}</app-button>
      <app-button variant="danger" (pressed)="handleConfirm()">{{ PHRASES.DELETE | translate }}</app-button>
    </div>
  </div>
</div>
