<div class="sidebarList__header" [class.sidebarList__header--collapsed]="collapsed">
  <button
    type="button"
    class="sidebarList__toggle"
    [appTooltip]="collapsed ? (PHRASES.BOARDS | translate) : ''"
    [attr.aria-label]="PHRASES.BOARDS | translate"
    [attr.aria-expanded]="boardListService.isOpen"
    (click)="collapsed || handleToggle()"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <rect x="7" y="7" width="3" height="9"></rect>
      <rect x="14" y="7" width="3" height="5"></rect>
    </svg>
    <span class="sidebarList__label" *ngIf="!collapsed">{{ PHRASES.BOARDS | translate }}</span>
    <app-icon
      *ngIf="!collapsed"
      name="chevron-right"
      class="sidebarList__chevron"
      [class.sidebarList__chevron--open]="boardListService.isOpen"
    ></app-icon>
  </button>
</div>

<ng-container *ngIf="!collapsed && boardListService.isOpen">
  <ng-container *ngIf="boardListService.boards$ | async as boards">
    <div class="sidebarList__rows" cdkDropList [cdkDropListData]="boards" (cdkDropListDropped)="handleDrop($event)">
      <a
        *ngFor="let board of boards; trackBy: trackById"
        class="sidebarList__row"
        cdkDrag
        cdkDragLockAxis="y"
        [routerLink]="boardLink(board)"
        routerLinkActive="sidebarList__row--active"
        (click)="$event.preventDefault(); handleOpen(board)"
      >
        <app-icon name="menu" class="sidebarList__icon"></app-icon>
        <span class="sidebarList__rowTitle">{{ board.title }}</span>
      </a>
    </div>
    <p class="sidebarList__empty" *ngIf="!boards.length">{{ PHRASES.NO_BOARDS_YET | translate }}</p>
    <button type="button" class="sidebarList__row sidebarList__create" (click)="handleCreate()">
      <span class="sidebarList__rowTitle">{{ PHRASES.CREATE_BOARD | translate }}</span>
      <app-icon name="plus" class="sidebarList__icon"></app-icon>
    </button>
    <a
      class="sidebarList__row sidebarList__create"
      [routerLink]="['/', AppRoutes.DASHBOARD, AppRoutes.BOARD_TEMPLATES]"
      routerLinkActive="sidebarList__row--active"
    >
      <span class="sidebarList__rowTitle">{{ PHRASES.BOARD_TEMPLATES | translate }}</span>
      <app-icon name="columns" class="sidebarList__icon"></app-icon>
    </a>
  </ng-container>
</ng-container>

<app-create-named-item-dialog
  *ngIf="isCreateDialogOpen"
  [dialogTitle]="PHRASES.NEW_BOARD | translate"
  [defaultValue]="PHRASES.UNTITLED_BOARD | translate"
  [errorMessage]="createErrorMessage"
  (confirmed)="handleCreateConfirmed($event)"
  (cancelled)="handleCreateCancelled()"
>
  <app-board-template-select [(templateId)]="selectedTemplateId"></app-board-template-select>
</app-create-named-item-dialog>
